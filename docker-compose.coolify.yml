# lokyy-brain — Coolify Compose (Phase D / Wave D1).
#
# Coolify's Traefik handles TLS + routing via SERVICE_FQDN_* magic vars.
# No `ports:` mappings here — every service is private to the compose net.
#
# Setup in Coolify UI:
#   1. Project → "+ New Resource" → "Docker Compose"
#   2. Repository: git URL of this repo
#   3. Compose File Path: docker-compose.coolify.yml
#   4. Environment Variables (see .env.coolify.example):
#        SERVICE_FQDN_LOKYYBRAIN_8787      e.g. lokyy.example.tld   (server / REST API)
#        SERVICE_FQDN_LOKYYPWA_80          e.g. lokyy.example.tld   (PWA static)
#        SERVICE_FQDN_LOKYYMCP_8788        e.g. mcp.lokyy.example.tld
#        SERVICE_FQDN_FORGEJO_3000         e.g. forgejo.lokyy.example.tld
#        POSTGRES_PASSWORD, LOKYY_MCP_TOKEN, GIT_REMOTE, LOKYY_VAULT_ID, ...
#   5. Deploy → Coolify pulls repo, builds, starts, fetches TLS certs.
#
# claude.ai Custom Connector → URL = https://<SERVICE_FQDN_LOKYYMCP_8788>/mcp,
# Auth = Bearer ${LOKYY_MCP_TOKEN}.

services:
  # ── Server (Hono REST API + setup wizard backend) ──────────────────────
  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_started
    environment:
      # Coolify magic-var → rewritten to public FQDN + Traefik labels auto-added.
      - SERVICE_FQDN_LOKYYBRAIN_8787
      - DATABASE_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      - LOKYY_VAULT_PROFILE=${LOKYY_VAULT_PROFILE:-karpathy}
      - GIT_REMOTE=${GIT_REMOTE}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-lokyy-brain}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      - OLLAMA_HOST=http://ollama:11434
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── PWA (nginx-served static build) ────────────────────────────────────
  lokyy-pwa:
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LOKYYPWA_80
    depends_on:
      lokyy-brain:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── MCP HTTP transport (claude.ai Custom-Connector endpoint) ───────────
  lokyy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lokyy-brain:
        condition: service_started
    environment:
      - SERVICE_FQDN_LOKYYMCP_8788
      - LOKYY_DB_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - LOKYY_VAULT_DIR=/var/lokyy/vault
      - LOKYY_GIT_REMOTE=${GIT_REMOTE}
      - LOKYY_GIT_BRANCH=${GIT_BRANCH:-main}
      - LOKYY_VAULT_ID=${LOKYY_VAULT_ID}
      - LOKYY_VAULT_PROFILE=${LOKYY_VAULT_PROFILE:-karpathy}
      - LOKYY_AGENT_ID=${LOKYY_AGENT_ID:-claude-code}
      - LOKYY_MCP_TOKEN=${SERVICE_PASSWORD_MCPTOKEN}
      - LOKYY_MCP_HTTP_PORT=8788
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    command: ["node", "/app/mcp/dist/binHttp.js"]
    healthcheck:
      # MCP HTTP exposes /mcp/health (200 OK, no auth) for liveness probes.
      test: ["CMD", "node", "-e", "require('net').connect(8788,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Forgejo (Vault git remote) ─────────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FORGEJO_3000
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Postgres (ParadeDB: pgvector + pg_search bundled) ──────────────────
  postgres:
    image: paradedb/paradedb:latest
    restart: unless-stopped
    environment:
      # Festes INTERNES DB-Passwort: die DB hat kein `ports:`-Mapping, ist also
      # nur im privaten Compose-Netz erreichbar. Kein manuelles Eintragen nötig.
      # (Coolify-Magic-Vars werden NICHT in eingebettete URLs expandiert — daher
      #  ein Literal, das in postgres + server + mcp identisch verwendet wird.)
      - POSTGRES_PASSWORD=lokyybraininternal
      - POSTGRES_DB=lokyy_brain
    volumes:
      # Postgres 18+ (ParadeDB latest) speichert Daten versioniert UNTER
      # /var/lib/postgresql — daher den Mount dorthin, nicht auf /data.
      # Neuer Volume-Name erzwingt eine frische, PG18-konforme Initialisierung.
      - postgres-data-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Ollama (embeddings + optional local chat) ──────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot init: pull embedding + chat models.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && \
        if [ "${OLLAMA_PULL_CHAT:-false}" = "true" ]; then \
          OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_CHAT_MODEL:-llama3.1:8b}; \
        fi && \
        echo "[ollama-init] models ready"
    restart: "no"

volumes:
  vault-data:
  forgejo-data:
  postgres-data-pg:
  ollama-data:
