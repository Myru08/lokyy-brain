# lokyy-brain — Coolify Compose (EMPFOHLENER Weg: ALLES in EINER Resource).
#
# Warum All-in-One? Coolify-Doku (https://coolify.io/docs/knowledge-base/docker/compose):
#   • "Services communicate using Docker's internal DNS ... reference services by
#      name, like http://auth:1234" — gilt INNERHALB EINER Compose-Resource.
#   • Getrennte Resources liegen je in einem eigenen Netz (Name = Resource-UUID);
#     "Connect to Predefined Network ... will make the internal Docker DNS not work
#     as expected" → man müsste auf `postgres-<uuid>` umstellen. Genau das verursacht
#     das EAI_AGAIN. Deshalb: ein Compose, ein Netz, native Namensauflösung.
#
# Sicherheit: KEIN `ports:` an postgres/ollama/forgejo → laut Doku bleiben nicht
# gemappte Services intern ("Unmapped services stay internal and accessible only
# to other services in the same compose"). Öffentlich wird nur, was eine Domain
# (SERVICE_FQDN_*) bekommt: lokyy-brain und Forgejo-UI.
#
# EIN Brain-Container liefert UI + API + MCP (Story 1.18):
#   • PWA        → `/`       (server/src/index.ts serviert pwa/dist + SPA-Fallback)
#   • REST-API   → `/api/*`
#   • MCP        → `/mcp`    (server/src/mcpMount.ts, in-process gemountet)
# Deshalb gibt es KEINEN separaten `lokyy-pwa`- und KEINEN `lokyy-mcp`-Container
# mehr: der nginx-PWA-Layer proxyte nur `/api/` und machte `/mcp` unerreichbar,
# und der Standalone-MCP-Container überbuchte das RAM der Box und riss das Brain
# mit. Eine Domain, ein Prozess, ein Port.
#
# DB-Passwort: SERVICE_PASSWORD_* ist der dokumentierte Auto-Secret-Mechanismus.
# Doku: diese Variablen "expand inline within compose files, including database
# connection URLs" und "will always have the same value for every service".
# → Wir nutzen ${SERVICE_PASSWORD_POSTGRES} in postgres UND in den DATABASE_URLs.
# Coolify generiert das Passwort einmalig automatisch — kein manuelles Eintragen.
#
# Setup in Coolify UI (Details in .env.coolify.example):
#   1. Project → "+ New Resource" → "Docker Compose" (Empty / from Repository)
#   2. Repository = git-URL dieses Repos, Compose File Path = docker-compose.coolify.yml
#   3. NICHT "Connect To Predefined Network" aktivieren (nicht nötig, alles in 1 Compose).
#   4. Pro öffentlichem Service in der UI "Add Domain" setzen → füllt SERVICE_FQDN_*.
#      Nötig sind nur zwei: lokyy-brain und forgejo.
#   5. Restliche Env aus .env.coolify.example eintragen, Deploy.
#
# claude.ai Custom Connector → URL = https://<Brain-Domain>/mcp, Bearer = LOKYY_MCP_TOKEN.

services:
  # ── Postgres (ParadeDB: pgvector + pg_search) ──────────────────────────
  # latest-pg17: PG17-Daten-Layout (kein PG18-Migrationsproblem). Intern only.
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      # Auto-Secret von Coolify (dokumentierter Mechanismus, einmalig generiert).
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=lokyy_brain
    volumes:
      # ParadeDB latest-pg17 nutzt das klassische PG-Datenlayout unter
      # /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready existiert im Postgres-Image — kein curl nötig.
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── Ollama (embeddings + optional local chat) ──────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ollama-CLI ist im Image vorhanden — kein curl nötig.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: Embedding-Modell ziehen (optional Chat-Modell).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    # Vor Coolifys Healthcheck-Tracking schützen: Einmal-Container, der beendet.
    # https://coolify.io/docs/knowledge-base/docker/compose (exclude_from_hc)
    exclude_from_hc: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && \
        if [ "${OLLAMA_PULL_CHAT:-false}" = "true" ]; then \
          OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_CHAT_MODEL:-llama3.1:8b}; \
        fi && \
        echo "[ollama-init] models ready"
    restart: "no"

  # ── Forgejo (Vault git remote + OAuth-Provider) ────────────────────────
  forgejo:
    # v15 = aktuelle LTS-Linie (v15.0.6, 2026-07-30); erhält Security-Fixes für
    # 15 Monate. v16 wäre latest-stable, LTS ist für fremde Vault-Daten sicherer.
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FORGEJO_3000
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
    volumes:
      - forgejo-data:/data
    healthcheck:
      # Forgejo-Image enthält wget (busybox) → /api/healthz prüfen.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Brain (PWA-UI + Hono REST API + in-process MCP + Setup-Wizard) ─────
  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server          # WICHTIG: sonst würde die letzte Stage (mcp) gebaut.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_started
    environment:
      # Coolify rewritet diese Var auf die public FQDN + setzt Traefik-Labels.
      - SERVICE_FQDN_LOKYYBRAIN_8787
      # SERVICE_PASSWORD_POSTGRES expandiert laut Doku auch INNERHALB dieser URL.
      - DATABASE_URL=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      # WICHTIG: 'para' als Default — 'karpathy' killt den Server ~30s nach Start.
      - LOKYY_VAULT_PROFILE=${LOKYY_VAULT_PROFILE:-para}
      - FORGEJO_BASE_URL=${FORGEJO_BASE_URL:-}
      - FORGEJO_OAUTH_CLIENT_ID=${FORGEJO_OAUTH_CLIENT_ID:-}
      - FORGEJO_OAUTH_CLIENT_SECRET=${FORGEJO_OAUTH_CLIENT_SECRET:-}
      - GIT_REMOTE=${GIT_REMOTE:-}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-lokyy-brain}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      # ── In-process MCP (/mcp) — ersetzt den früheren lokyy-mcp-Container ──
      # Bearer-Token für claude.ai/Claude Code. Ohne diese Var ist /mcp deaktiviert.
      - LOKYY_MCP_TOKEN=${LOKYY_MCP_TOKEN}
      # Leer lassen bis der Setup-Wizard durch ist; danach die vaults.id pinnen.
      - LOKYY_VAULT_ID=${LOKYY_VAULT_ID:-}
      - LOKYY_AGENT_ID=${LOKYY_AGENT_ID:-claude-code}
      # OAuth 2.1 für den claude.ai-Connector; fallen ohne Wert auf
      # LOKYY_MCP_TOKEN zurück (siehe mcp/src/oauth.ts).
      - LOKYY_OAUTH_PASSWORD=${LOKYY_OAUTH_PASSWORD:-}
      - LOKYY_OAUTH_SIGNING_SECRET=${LOKYY_OAUTH_SIGNING_SECRET:-}
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      # node-eigener TCP-Port-Check: hängt nicht an curl/wget, funktioniert in
      # JEDEM node-Image (auch ohne curl). Bindet :8787 = up.
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
  ollama-data:
  forgejo-data:
  vault-data:
