# Lokyy-Brain — Postgres (ParadeDB) als eigener Coolify-SERVICE.
#
# ⚠️ OPTIONALE VARIANTE — NICHT der empfohlene Weg.
#    Empfohlen ist docker-compose.coolify.yml (ALLES in EINER Resource), weil
#    dort `postgres` nativ per Docker-DNS auflöst. Diese getrennten Composes
#    sind nur sinnvoll, wenn du DB/Ollama bewusst unabhängig betreiben willst —
#    und dann musst du die EAI_AGAIN-Falle kennen (siehe unten).
#
# In Coolify: "+ New" → "Docker Compose (from repository)" → dieses Repo,
# Compose File Path: docker-compose.coolify-postgres.yml.
#
# WICHTIG / Sicherheit: KEIN `ports:`-Mapping → die DB hat KEINEN Public Port,
# ist also nur im internen Coolify-Netz erreichbar. Genau das wollen wir.
#
# ⚠️ CROSS-RESOURCE-HOSTNAME (EAI_AGAIN-URSACHE):
#   Laut Coolify-Doku (knowledge-base/docker/compose) liegt JEDE Compose-Resource
#   in einem EIGENEN Netz (Name = Resource-UUID). Damit die App diese DB erreicht,
#   musst du in der App-Resource "Connect To Predefined Network" aktivieren —
#   ABER: dann "will make the internal Docker DNS not work as expected", und
#   Coolify benennt den Host in `postgres-<uuid>` um. Der bloße Name `postgres`
#   löst dann NICHT auf → genau das ist der EAI_AGAIN-/Restart-Loop.
#   Du musst in der App also POSTGRES_HOST = `postgres-<uuid>` setzen (UUID aus
#   der Coolify-UI dieser Resource). Deshalb ist die All-in-One-Variante robuster.
#
# ParadeDB = Postgres + pg_search (BM25) + pgvector — auf pg17 gepinnt
# (kein PG18-Daten-Layout-Problem).
#
# Env (in Coolify setzen — am besten als SHARED VARIABLE, damit App + DB
# dasselbe Passwort nutzen):
#   POSTGRES_PASSWORD  = ein sicheres Passwort (frei wählbar)

services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=lokyy_brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
