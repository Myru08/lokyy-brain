# DEBUG-Variante: nur postgres+brain, DEBUG_HOLD an, um die aktuelle DB-Fehlerzeile
# zu lesen. Wird nach dem Fix auf die volle Demo (pwa+mcp) zurueckgesetzt.

services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lokyybraininternal
      - POSTGRES_DB=lokyy_brain
    volumes:
      - postgres-data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LOKYYBRAIN_8787
      - DATABASE_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      - LOKYY_VAULT_PROFILE=para
      - PORT=8787
      - NODE_ENV=production
      - LOKYY_DEBUG_HOLD=1
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data2:
  vault-data:
