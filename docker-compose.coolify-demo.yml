# lokyy-brain — DEMO-Compose (Single-Service für die Kurs-Aufnahme).
#
# Minimal & robust: NUR Postgres (ParadeDB) + Brain. Der Brain serviert die PWA
# (UI) selbst auf / und die API unter /api/* + /health — also EINE funktionierende
# Domain für alles. Kein separater PWA/MCP-Container (deren Coolify-Zweit-Routing
# zickte; MCP lässt sich später nachrüsten).
#
# Gelöste Stolperfallen:
#  • DB-Auth: POSTGRES_PASSWORD greift nur bei Erst-Init des Volumes → frisches
#    Volume 'postgres-data2' passend zu 'lokyybraininternal'.
#  • Healthcheck: der Server ist via Traefik (Container-IP) erreichbar, aber NICHT
#    über Loopback (127.0.0.1/localhost) — interne TCP/HTTP-Checks reapten den
#    gesunden Container. Darum bewusst lenient (exit 0); extern bestätigt /health=200.

services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lokyybraininternal
      - POSTGRES_DB=lokyy_brain
    volumes:
      - postgres-data2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server          # WICHTIG: sonst würde die letzte Stage (mcp) gebaut.
    restart: unless-stopped
    # Server-seitige Forgejo-Calls (OAuth-Token-Tausch, /api/v1/user, Repos)
    # gehen sonst über Cloudflare und hairpinnen auf denselben Server zurück →
    # Hänger → 502 im OAuth-Callback. host-gateway löst forgejo.kimiboca.de auf
    # den Docker-Host auf → lokaler Traefik terminiert TLS (gültiges LE-Cert) und
    # routet intern zu Forgejo. Der Browser nutzt weiterhin die öffentliche Domain.
    extra_hosts:
      - "forgejo.kimiboca.de:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LOKYYBRAIN_8787
      - DATABASE_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      - LOKYY_VAULT_PROFILE=para
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data2:/var/lokyy/vault
      - tenants-data:/var/lokyy/vaults
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres-data2:
  vault-data2:
  tenants-data:
