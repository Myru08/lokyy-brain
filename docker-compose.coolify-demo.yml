# lokyy-brain — SCHLANKE DEMO-Compose (für die Kurs-Aufnahme).
#
# Ziel: läuft GARANTIERT auf einer ausgelasteten Box, ohne OOM-Überraschung.
# Unterschiede zur vollen docker-compose.coolify.yml:
#   • KEIN Ollama / ollama-init  → kein Embedding-Modell-Pull, kein RAM-Spike
#     ~30 s nach Start (das war der wahrscheinliche OOM-Kill-Auslöser).
#     Folge: nur Tier-1-Suche (BM25 über ParadeDB). Semantische Tier-2-Suche
#     ist aus — fürs Zeigen (Notizen anlegen, suchen, MCP, Wiki) reicht das.
#     Code bestätigt: ohne OLLAMA_HOST startet der Server sauber
#     (server/src/index.ts: LLM-Registry-Fehler brechen den Start NIE ab).
#   • KEIN Forgejo  → du betreibst bereits eins. Vault-Git-Remote wird im
#     Setup-Wizard nachgetragen (Server-Log: "GIT_REMOTE not set — vault clone
#     deferred to setup wizard" — kein Fehler).
#   • FESTES internes DB-Passwort statt ${SERVICE_PASSWORD_POSTGRES}.
#     Postgres hat KEIN `ports:` → kein Public Port → nur compose-intern
#     erreichbar. Ein festes internes Passwort ist damit unkritisch und nimmt
#     das letzte Risiko (Magic-Var-Expansion in der URL) raus.
#
# Alles in EINER Coolify-Compose-Resource → native Docker-DNS (Servicename
# `postgres` löst auf, kein EAI_AGAIN). "Connect To Predefined Network" NICHT
# aktivieren.
#
# Setup in Coolify:
#   1. Project → "+ New Resource" → "Docker Compose" (from Repository)
#   2. Compose File Path: docker-compose.coolify-demo.yml
#   3. NICHT "Connect To Predefined Network".
#   4. Pro öffentlichem Service "Add Domain" (Brain 8787, PWA 80, MCP 8788).
#   5. Env setzen: LOKYY_MCP_TOKEN (Bearer fürs claude.ai-Connector). Rest optional.
#   6. Deploy.
#
# claude.ai Custom Connector → URL = https://<MCP-Domain>/mcp, Bearer = LOKYY_MCP_TOKEN.

services:
  # ── Postgres (ParadeDB: pgvector + pg_search) — intern, kein Public Port ──
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=lokyybraininternal
      - POSTGRES_DB=lokyy_brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── Server (Hono REST API + Setup-Wizard-Backend) ──────────────────────
  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server          # WICHTIG: sonst würde die letzte Stage (mcp) gebaut.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LOKYYBRAIN_8787
      - DATABASE_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      # HART auf 'para' — 'karpathy' killt den Server ~30s nach Start. Bewusst
      # KEIN ${...}, damit keine (Alt-)UI-Env-Var das je überschreiben kann.
      - LOKYY_VAULT_PROFILE=para
      # KEIN OLLAMA_HOST → Ollama wird nicht registriert, Tier-2 bleibt aus.
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      # node-eigener TCP-Port-Check (kein curl): funktioniert in jedem node-Image.
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── PWA (nginx/wget-served static build) ───────────────────────────────
  lokyy-pwa:
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: unless-stopped
    depends_on:
      lokyy-brain:
        condition: service_started
    environment:
      - SERVICE_FQDN_LOKYYPWA_80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── MCP HTTP transport (claude.ai Custom-Connector-Endpoint) ───────────
  lokyy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp             # WICHTIG: explizit mcp-Stage.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lokyy-brain:
        condition: service_started
    environment:
      - SERVICE_FQDN_LOKYYMCP_8788
      - LOKYY_DB_URL=postgres://postgres:lokyybraininternal@postgres:5432/lokyy_brain
      - LOKYY_VAULT_DIR=/var/lokyy/vault
      - LOKYY_VAULT_PROFILE=para
      - LOKYY_AGENT_ID=${LOKYY_AGENT_ID:-claude-code}
      - LOKYY_MCP_TOKEN=${LOKYY_MCP_TOKEN}
      - LOKYY_MCP_HTTP_PORT=8788
      - LOKYY_BRAIN_URL=http://lokyy-brain:8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8788,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  vault-data:
