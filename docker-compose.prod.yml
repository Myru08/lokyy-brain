# lokyy-brain — Production Stack mit Caddy + HTTPS + claude.ai-fähigem MCP.
#
# Voraussetzung: VPS mit Docker + Domain (z.B. lokyy.deine-domain.tld) deren
# A-Record auf den Server zeigt. Caddy holt automatisch Let's-Encrypt-Cert.
#
# Bring up:
#   cp .env.production.example .env
#   # .env editieren (Secrets, Domain)
#   docker compose -f docker-compose.prod.yml up -d
#
# claude.ai Custom Connector dann konfigurieren mit:
#   URL:    https://${LOKYY_DOMAIN}/mcp
#   Auth:   Bearer ${LOKYY_MCP_TOKEN}
#
# Architektur:
#   Internet → Caddy (TLS) ─┬→ lokyy-brain :8787   (PWA + REST)
#                           └→ lokyy-mcp-http :8788 (MCP HTTP transport)
#   intern: postgres, forgejo, ollama

services:
  caddy:
    image: caddy:2-alpine
    container_name: lokyy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      LOKYY_DOMAIN: ${LOKYY_DOMAIN:?LOKYY_DOMAIN required}
    networks:
      - lokyy-net

  lokyy-brain:
    build: .
    container_name: lokyy-brain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-lokyy}@postgres:5432/lokyy_brain
      VAULT_DIR: /var/lokyy/vault
      GIT_REMOTE: ${GIT_REMOTE:?GIT_REMOTE required}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-lokyy-brain}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      OLLAMA_HOST: http://ollama:11434
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      PORT: 8787
    volumes:
      - vault-data:/var/lokyy/vault
    networks:
      - lokyy-net

  lokyy-mcp-http:
    build: .
    container_name: lokyy-mcp-http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lokyy-brain:
        condition: service_started
    environment:
      LOKYY_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-lokyy}@postgres:5432/lokyy_brain
      LOKYY_VAULT_DIR: /var/lokyy/vault
      LOKYY_GIT_REMOTE: ${GIT_REMOTE:?GIT_REMOTE required}
      LOKYY_GIT_BRANCH: ${GIT_BRANCH:-main}
      LOKYY_VAULT_ID: ${LOKYY_VAULT_ID:?LOKYY_VAULT_ID required}
      LOKYY_AGENT_ID: ${LOKYY_AGENT_ID:-claude-code}
      LOKYY_MCP_TOKEN: ${LOKYY_MCP_TOKEN:?LOKYY_MCP_TOKEN required}
      LOKYY_MCP_HTTP_PORT: "8788"
    volumes:
      - vault-data:/var/lokyy/vault # Same vault working-copy as the main server
    # Wichtig: kein gemeinsamer commit, weil gitService promise-lock pro-Prozess.
    # Für true-shared-vault-Setup beide Services denselben Vault-Pfad nutzen lassen
    # — gitService serialisiert pro Container, NICHT cross-container.
    # Wenn beide schreiben: Risiko von Konflikt → in Folge-Iteration lösen via
    # zentralem git-daemon oder shared advisory-lock.
    command: ["node", "/app/mcp/dist/binHttp.js"]
    networks:
      - lokyy-net

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: lokyy-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
    volumes:
      - forgejo-data:/data
    networks:
      - lokyy-net

  postgres:
    # ParadeDB drop-in Postgres image — ships pg_search (Tantivy BM25) AND
    # pgvector. Required for Phase A Wave A1 / Story 2 hybrid retrieval.
    image: paradedb/paradedb:latest
    container_name: lokyy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokyy}
      POSTGRES_DB: lokyy_brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lokyy-net

  ollama:
    image: ollama/ollama:latest
    container_name: lokyy-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - lokyy-net

  ollama-init:
    image: ollama/ollama:latest
    container_name: lokyy-ollama-init
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5 &&
        OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text &&
        echo "[ollama-init] nomic-embed-text ready"
    restart: "no"
    networks:
      - lokyy-net

networks:
  lokyy-net:
    driver: bridge

volumes:
  vault-data:
  forgejo-data:
  postgres-data:
  ollama-data:
  caddy-data:
  caddy-config:
