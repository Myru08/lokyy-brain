# lokyy-brain — Production stack (Story 1.9).
#
# `docker compose up -d` starts the full app + Forgejo (vault remote) +
# Postgres-with-pgvector + Ollama (with nomic-embed-text auto-pulled).
#
# Required env vars (provide via .env or shell):
#   POSTGRES_PASSWORD   — initial password for the `postgres` superuser
#   GIT_AUTHOR_EMAIL    — commit identity (defaults to lokyy-brain@localhost)
#   SUPADATA_API_KEY    — optional, for YouTube pipe
#
# After `docker compose up -d`:
#   - Forgejo:    http://localhost:3000
#   - lokyy-brain UI: http://localhost:8787
#   - Postgres:   localhost:5432 (internal-only by default; comment in ports to expose)
#   - Ollama:     http://localhost:11434

services:
  lokyy-brain:
    build: .
    container_name: lokyy-brain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-lokyy}@postgres:5432/lokyy_brain
      VAULT_DIR: /var/lokyy/vault
      GIT_REMOTE: ${GIT_REMOTE:?GIT_REMOTE required (Forgejo SSH URL)}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-lokyy-brain}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      OLLAMA_HOST: http://ollama:11434
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      PORT: 8787
    ports:
      - "8787:8787"
    volumes:
      - vault-data:/var/lokyy/vault
    networks:
      - lokyy-net

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: lokyy-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data
    networks:
      - lokyy-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lokyy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokyy}
      POSTGRES_DB: lokyy_brain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lokyy_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lokyy-net

  ollama:
    image: ollama/ollama:latest
    container_name: lokyy-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - lokyy-net

  ollama-init:
    image: ollama/ollama:latest
    container_name: lokyy-ollama-init
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5 &&
        OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text &&
        echo "[ollama-init] nomic-embed-text ready"
    restart: "no"
    networks:
      - lokyy-net

networks:
  lokyy-net:
    driver: bridge

volumes:
  vault-data:
  forgejo-data:
  postgres-data:
  ollama-data:
