# Lokyy-Brain — Ollama als eigener Coolify-SERVICE (Embeddings für Tier-2).
#
# ⚠️ OPTIONALE VARIANTE — NICHT der empfohlene Weg (siehe coolify-postgres.yml).
#    Empfohlen: docker-compose.coolify.yml (alles in EINER Resource).
#
# In Coolify: "+ New" → "Docker Compose (from repository)" → dieses Repo,
# Compose File Path: docker-compose.coolify-ollama.yml.
#
# KEIN `ports:` → nur intern erreichbar.
# ⚠️ Cross-Resource-Hostname: NICHT `ollama`, sondern `ollama-<uuid>` (Coolify
#    benennt bei "Connect To Predefined Network" um; reiner Name = EAI_AGAIN).
#    In der App: OLLAMA_HOST=http://ollama-<uuid>:11434.
#
# `ollama-init` zieht beim Start einmalig das Embedding-Modell.
# Env (optional): OLLAMA_EMBED_MODEL (default nomic-embed-text)

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    exclude_from_hc: true
    entrypoint:
      - /bin/sh
      - -c
      - 'OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && echo "[ollama-init] embedding model ready"'
    restart: "no"

volumes:
  ollama-data:
