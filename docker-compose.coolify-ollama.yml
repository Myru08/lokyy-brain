# Lokyy-Brain — Ollama als eigener Coolify-SERVICE (Embeddings für Tier-2).
#
# In Coolify: "+ New" → "Docker Compose (from repository)" → dieses Repo,
# Compose File Path: docker-compose.coolify-ollama.yml.
#
# KEIN `ports:` → nur intern erreichbar. Hostname für die App: `ollama` (11434),
# sofern im selben Netz ("Connect To Predefined Network").
#
# `ollama-init` zieht beim Start einmalig das Embedding-Modell.
# Env (optional): OLLAMA_EMBED_MODEL (default nomic-embed-text)

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - 'OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && echo "[ollama-init] embedding model ready"'
    restart: "no"

volumes:
  ollama-data:
