# lokyy-brain — Coolify Application (Architektur B: Resources + App split).
#
# THIS COMPOSE contains ONLY the three Lokyy services. Postgres, Ollama and
# Forgejo are deployed as separate Coolify "Resources" in the same Project
# and are reachable via Coolify's shared Docker network (service-name
# hostname resolution).
#
# Why split? The all-in-one docker-compose.coolify.yml builds 3 Node images
# AND pulls 3 vendor images at once. On Coolify build hosts <6 GB RAM this
# OOM-kills the builder (Exit 255). Splitting into Resources lets each piece
# scale, restart, and back up independently.
#
# Coolify Magic-Vars (set indirectly via "Add Domain" in UI):
#   SERVICE_FQDN_LOKYYBRAIN_8787  → e.g. api.lokyy.example.tld
#   SERVICE_FQDN_LOKYYPWA_80      → e.g. lokyy.example.tld
#   SERVICE_FQDN_LOKYYMCP_8788    → e.g. mcp.lokyy.example.tld
#
# User-provided ENV-Vars (Coolify UI → Application → Environment) —
# values point at the Resources by their compose service name:
#   POSTGRES_PASSWORD          (matches what you set on the Postgres resource)
#   DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/lokyy_brain
#   OLLAMA_HOST=http://ollama:11434
#   GIT_REMOTE=http://forgejo:3000/oliver/lokyy-vault
#   GIT_BRANCH=main
#   GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL
#   LOKYY_MCP_TOKEN            (Bearer token for claude.ai Custom Connector)
#   LOKYY_VAULT_ID             (filled AFTER first Setup Wizard run)
#   LOKYY_AGENT_ID=claude-code
#   OLLAMA_EMBED_MODEL=nomic-embed-text
#   SUPADATA_API_KEY           (optional; UI-configurable)
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, COHERE_API_KEY  (optional)
#
# See docs/DEPLOY-RESOURCES.md for the step-by-step Coolify setup.

services:
  # ── Server (Hono REST API + setup wizard backend) ──────────────────────
  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      # Coolify magic-var → rewritten to public FQDN + Traefik labels auto-added.
      - SERVICE_FQDN_LOKYYBRAIN_8787
      - DATABASE_URL=${DATABASE_URL}
      - VAULT_DIR=/var/lokyy/vault
      - GIT_REMOTE=${GIT_REMOTE}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-lokyy-brain}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── PWA (nginx-served static build) ────────────────────────────────────
  lokyy-pwa:
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LOKYYPWA_80
    depends_on:
      lokyy-brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── MCP HTTP transport (claude.ai Custom-Connector endpoint) ───────────
  lokyy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    depends_on:
      lokyy-brain:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LOKYYMCP_8788
      - LOKYY_DB_URL=${DATABASE_URL}
      - LOKYY_VAULT_DIR=/var/lokyy/vault
      - LOKYY_GIT_REMOTE=${GIT_REMOTE}
      - LOKYY_GIT_BRANCH=${GIT_BRANCH:-main}
      - LOKYY_VAULT_ID=${LOKYY_VAULT_ID}
      - LOKYY_AGENT_ID=${LOKYY_AGENT_ID:-claude-code}
      - LOKYY_MCP_TOKEN=${LOKYY_MCP_TOKEN}
      - LOKYY_MCP_HTTP_PORT=8788
      - LOKYY_BRAIN_URL=http://lokyy-brain:8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      # MCP HTTP exposes /mcp/health (200 OK, no auth) for liveness probes.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8788/mcp/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  vault-data:
