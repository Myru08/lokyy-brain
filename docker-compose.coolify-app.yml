# lokyy-brain — Coolify Application (Architektur B: Resources + App split).
#
# ⚠️ OPTIONALE VARIANTE — NICHT empfohlen. Nimm docker-compose.coolify.yml.
#    Diese Datei enthält NUR die drei Lokyy-Services; Postgres, Ollama und
#    Forgejo laufen als getrennte Coolify-Resources.
#
# ⚠️ EAI_AGAIN-FALLE (der Grund, warum diese Variante zickt):
#    Coolify-Doku (knowledge-base/docker/compose): getrennte Resources liegen je
#    in einem eigenen Netz. Erst "Connect To Predefined Network" verbindet sie —
#    "will make the internal Docker DNS not work as expected": die Hosts heißen
#    dann `postgres-<uuid>` / `ollama-<uuid>` / `forgejo-<uuid>`, NICHT `postgres`.
#    Der bloße Servicename löst NICHT auf → EAI_AGAIN + 10×-Restart-Loop.
#    Du MUSST hier die UUID-Hosts setzen (UUID je aus der Coolify-UI der Resource):
#       POSTGRES_HOST = postgres-<uuid>
#       OLLAMA_HOST   = http://ollama-<uuid>:11434
#       GIT_REMOTE    = http://forgejo-<uuid>:3000/<user>/lokyy-vault
#
# Coolify Magic-Vars (set indirectly via "Add Domain" in UI):
#   SERVICE_FQDN_LOKYYBRAIN_8787  → e.g. api.lokyy.example.tld
#   SERVICE_FQDN_LOKYYPWA_80      → e.g. lokyy.example.tld
#   SERVICE_FQDN_LOKYYMCP_8788    → e.g. mcp.lokyy.example.tld
#
# User-provided ENV-Vars (Coolify UI → Application → Environment):
#   POSTGRES_PASSWORD          (gleicher Wert wie auf der Postgres-Resource)
#   POSTGRES_HOST=postgres-<uuid>
#   OLLAMA_HOST=http://ollama-<uuid>:11434
#   GIT_REMOTE=http://forgejo-<uuid>:3000/<user>/lokyy-vault
#   GIT_BRANCH=main ; GIT_AUTHOR_NAME ; GIT_AUTHOR_EMAIL
#   LOKYY_MCP_TOKEN            (Bearer token for claude.ai Custom Connector)
#   LOKYY_VAULT_ID             (filled AFTER first Setup Wizard run)
#   LOKYY_AGENT_ID=claude-code
#   OLLAMA_EMBED_MODEL=nomic-embed-text
#   SUPADATA_API_KEY           (optional; UI-configurable)
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, COHERE_API_KEY  (optional)

services:
  # ── Server (Hono REST API + setup wizard backend) ──────────────────────
  lokyy-brain:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      # Coolify magic-var → rewritten to public FQDN + Traefik labels auto-added.
      - SERVICE_FQDN_LOKYYBRAIN_8787
      # Wird automatisch zusammengebaut aus zwei einfachen Werten, die du in der
      # Coolify-App-Env setzt:
      #   POSTGRES_HOST     = UUID der Postgres-Resource (z. B. ba85vwbow5cl1n5epeu6yolo)
      #   POSTGRES_PASSWORD = aus der Postgres-Resource (deren Env-Variable)
      # Kein manuelles URL-Basteln mehr.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/lokyy_brain
      - VAULT_DIR=/var/lokyy/vault
      - LOKYY_VAULT_PROFILE=${LOKYY_VAULT_PROFILE:-para}
      - GIT_REMOTE=${GIT_REMOTE}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-lokyy-brain}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-lokyy-brain@localhost}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      # node-eigener TCP-Port-Check (kein curl): funktioniert in jedem node-Image.
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── PWA (nginx-served static build) ────────────────────────────────────
  lokyy-pwa:
    build:
      context: .
      dockerfile: pwa/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LOKYYPWA_80
    depends_on:
      lokyy-brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── MCP HTTP transport (claude.ai Custom-Connector endpoint) ───────────
  lokyy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    depends_on:
      lokyy-brain:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_LOKYYMCP_8788
      - LOKYY_DB_URL=postgres://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/lokyy_brain
      - LOKYY_VAULT_DIR=/var/lokyy/vault
      - LOKYY_GIT_REMOTE=${GIT_REMOTE}
      - LOKYY_GIT_BRANCH=${GIT_BRANCH:-main}
      - LOKYY_VAULT_ID=${LOKYY_VAULT_ID}
      - LOKYY_VAULT_PROFILE=${LOKYY_VAULT_PROFILE:-para}
      - LOKYY_AGENT_ID=${LOKYY_AGENT_ID:-claude-code}
      - LOKYY_MCP_TOKEN=${LOKYY_MCP_TOKEN}
      - LOKYY_MCP_HTTP_PORT=8788
      - LOKYY_BRAIN_URL=http://lokyy-brain:8787
      - NODE_ENV=production
    volumes:
      - vault-data:/var/lokyy/vault
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8788,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  vault-data:
